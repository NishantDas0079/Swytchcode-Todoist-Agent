  todoist.api.byCompletionDate.list:
    SUMMARY: Tasks Completed By Completion Date
    DESC: |-
      Retrieves a list of completed tasks strictly limited by the specified completion
      date range (up to 3 months).

      It can retrieve completed items:

      - From all the projects the user has joined in a workspace
      - From all the projects of the user
      - That match many [supported
        filters](https://todoist.com/help/articles/introduction-to-filters-V98wIH)

      By default, the response is limited to a page containing a maximum of 50 items
      (configurable using `limit`).

      Subsequent pages of results can be fetched by using the `next_cursor` value from the
      response as the `cursor` value for the next request.
    HTTP:
      METHOD: GET
      ENDPOINT: /api/v1/tasks/completed/by_completion_date
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - since:
          TYPE: TIMESTAMP
          LOCATION: query
      - until:
          TYPE: TIMESTAMP
          LOCATION: query
      - workspace_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - project_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - section_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - parent_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - filter_query:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - filter_lang:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - cursor:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 50
      - public_key:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(TasksCompletedDateResponse)
        RETURNVAR: todoist_api_byCompletionDate_list
        STATUS: 200
        PAGINATION:
          TYPE: cursor
          CURSOR_FIELD: next_cursor
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not Found (HTTP 404)
    CANONICAL_ID: todoist.api.byCompletionDate.list
  todoist.api.byDueDate.list:
    SUMMARY: Tasks Completed By Due Date
    DESC: |-
      Retrieves a list of completed items strictly limited by the specified due date range
      (up to 6 weeks).

      It can retrieve completed items:

      - From within a project, section, or parent item
      - From all the projects the user has joined in a workspace
      - From all the projects of the user
      - That match many [supported
        filters](https://todoist.com/help/articles/introduction-to-filters-V98wIH)

      By default, the response is limited to a page containing a maximum of 50 items
      (configurable using `limit`).

      Subsequent pages of results can be fetched by using the `next_cursor` value from the
      response as the `cursor` value for the next request.
    HTTP:
      METHOD: GET
      ENDPOINT: /api/v1/tasks/completed/by_due_date
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - since:
          TYPE: TIMESTAMP
          LOCATION: query
      - until:
          TYPE: TIMESTAMP
          LOCATION: query
      - workspace_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - project_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - section_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - parent_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - filter_query:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - filter_lang:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - cursor:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 50
    RETURNS:
      - RETURNTYPE: STRUCT(TasksCompletedDateResponse)
        RETURNVAR: todoist_api_byDueDate_list
        STATUS: 200
        PAGINATION:
          TYPE: cursor
          CURSOR_FIELD: next_cursor
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not Found (HTTP 404)
    CANONICAL_ID: todoist.api.byDueDate.list
  todoist.api.stats.list:
    SUMMARY: Get Productivity Stats
    DESC: |-
      Get comprehensive productivity statistics for the authenticated user.
      This endpoint is used to display information about the
      [Karma system](https://www.todoist.com/help/articles/introduction-to-karma-OgWkWy).

      Returns detailed completion statistics including:

      - Daily completion counts with per-project breakdowns for the last 7 days
      - Weekly completion counts with per-project breakdowns for the last 4 weeks
      - Total completed task count
      - Karma score, trend, graph data, and update history
      - Goal settings (daily/weekly goals, ignore days, vacation mode)
      - Streak information (current, last, and maximum daily and weekly streaks)
      - Project color mappings for visualization
    HTTP:
      METHOD: GET
      ENDPOINT: /api/v1/tasks/completed/stats
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(ProductivityStatsResponse)
        RETURNVAR: todoist_api_stats_list
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not Found (HTTP 404)
    CANONICAL_ID: todoist.api.stats.list
  todoist.api.migratePersonalToken.create:
    SUMMARY: Migrate Personal Token
    DESC: |-
      Tokens obtained via the old email/password authentication method can be
      migrated to the new OAuth access token. Migrating your users' personal tokens
      will allow users to see your app in their Todoist Settings page and give them
      the ability to manage their app authorization.

      A successful response has `200 OK` status and `application/json` Content-Type.
    HTTP:
      METHOD: POST
      ENDPOINT: /api/v1/access_tokens/migrate_personal_token
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Body_999fd79a)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Body_999fd79a)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(_MigratePersonalTokenResponse)
        RETURNVAR: todoist_api_migratePersonalToken_create
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not Found (HTTP 404)
    CANONICAL_ID: todoist.api.migratePersonalToken.create
