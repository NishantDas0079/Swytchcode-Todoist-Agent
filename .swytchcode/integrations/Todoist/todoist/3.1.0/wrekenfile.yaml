    DESC: Deletes a workspace invitation. Only admins can delete invitations.
    HTTP:
      METHOD: POST
      ENDPOINT: /api/v1/workspaces/invitations/delete
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Body_52bab197)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Body_52bab197)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(WorkspaceInvitationView)
        RETURNVAR: todoist_api_invitations_delete
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not Found (HTTP 404)
    CANONICAL_ID: todoist.api.invitations.delete
  todoist.api.all.list:
    SUMMARY: All Invitations
    DESC: |-
      Return a list containing details of all pending invitation to a workspace.

      This list is not paginated. All workspace members can access this list.
    HTTP:
      METHOD: GET
      ENDPOINT: /api/v1/workspaces/invitations/all
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - workspace_id:
          TYPE: INT
          LOCATION: query
    RETURNS:
      - RETURNTYPE: "[]STRUCT(WorkspaceInvitationView)"
        RETURNVAR: todoist_api_all_list
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not Found (HTTP 404)
    CANONICAL_ID: todoist.api.all.list
  todoist.api.accept.update:
