  todoist.api.join.create:
    SUMMARY: Join
    DESC: |-
      Join a workspace via link or via workspace ID, if the user can auto-join
      the workspace by domain.

      ## Joining by Domain
      This is possible if:
      - The user is verified
      - The user has a user e-mail belonging to a domain that is set
        as a domain name for a workspace
      - That workspace has the auto-join by domain feature enabled
    HTTP:
      METHOD: POST
      ENDPOINT: /api/v1/workspaces/join
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Body_fe5aa153)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Body_fe5aa153)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(WorkspaceUserView)
        RETURNVAR: todoist_api_join_create
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not Found (HTTP 404)
    CANONICAL_ID: todoist.api.join.create
