    RETURNS:
      - RETURNTYPE: STRUCT(WorkspaceInvitationView)
        RETURNVAR: todoist_api_accept_update
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: ANY
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not Found (HTTP 404)
    CANONICAL_ID: todoist.api.accept.update
  todoist.api.invitations.reject:
    SUMMARY: Reject Invitation
    DESC: Reject a workspace invitation. Usable by authenticated users only.
    HTTP:
