  todoist.api.archived.get:
    SUMMARY: Archived Projects
    DESC: |-
      Return archived projects in a workspace.

      Workspace guests cannot list archived projects and receive a `FORBIDDEN`
      error. Results are paginated by `cursor` and `limit`.
    HTTP:
      METHOD: GET
      ENDPOINT: /api/v1/workspaces/{workspace_id}/projects/archived
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - workspace_id:
          TYPE: INT
          LOCATION: path
      - cursor:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 100
    RETURNS:
      - RETURNTYPE: STRUCT(_ProjectsResponse)
        RETURNVAR: todoist_api_archived_get
        STATUS: 200
        PAGINATION:
          TYPE: cursor
          CURSOR_FIELD: next_cursor
    ERRORS:
